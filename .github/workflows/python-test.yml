name: Checks

on:
  push:
    paths-ignore:
      - "**.css"
      - "**.js"
      - "**.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.css"
      - "**.js"
      - "**.md"

jobs:
  pre-commit:
    name: Pre Commit Checks
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Pre Commit Checks
        uses: pre-commit/action@v3.0.1

  build-test:
    name: PyPi Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build package
        run: make package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          if-no-files-found: ignore
  test-coverage:
    name: Test Coverage (Python ${{ matrix.python-version }} DB ${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: [pre-commit, build-test]

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: temp_password_aa_tox_tests
          MYSQL_DATABASE: tox_allianceauth
        ports:
          - 3306:3306
        options: --tmpfs /var/lib/mysql

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        database:
          # https://endoflife.date/mysql
          - mysql:8.4 # [LTS] Maintained until: 30 Apr 2029
          - mysql:9.7 # [LTS] Maintained until: 21 Apr 2034 and Latest official release
          # https://endoflife.date/mariadb and https://mariadb.com/kb/en/mariadb-server-release-dates/
          - mariadb:10.11 # [LTS] Maintained until: February 2028
          - mariadb:11.4 # [LTS] Maintained until: May 2029
          - mariadb:11.8 # [LTS] Maintained until: June 2028
          - mariadb:12.3 # [LTS] Maintained until: June 2029 and Latest official release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Tox
        run: uv tool install --python ${{ matrix.python-version }} tox --with tox-uv --with tox-gh-actions

      - name: Run Tox
        env:
          AA_DB_HOST: 127.0.0.1
          AA_DB_NAME: tox_allianceauth
          AA_DB_USER: root
          AA_DB_PASSWORD: temp_password_aa_tox_tests
          AA_REDIS: "localhost:6379"
        run: tox -v

      - name: Create report name
        env:
          COVERAGE_REPORT_NAME: "coverage-${{ matrix.python-version }}-${{ matrix.database }}"
        run: |
          COVERAGE_REPORT_NAME=${COVERAGE_REPORT_NAME//:/_}
          echo "COVERAGE_REPORT_NAME=${COVERAGE_REPORT_NAME}" >> $GITHUB_ENV
          echo "COVERAGE_REPORT_NAME=${COVERAGE_REPORT_NAME}"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COVERAGE_REPORT_NAME }}
          path: coverage.xml
          if-no-files-found: ignore

  upload-coverage:
    name: Upload to Codecov
    runs-on: ubuntu-latest
    needs: [test-coverage]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos but fails for rate limits
          directory: artifacts
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
